  const parseCssColor = (cssColor) =&gt; {
    const rgbMatch = cssColor.match(/rgba?\(([-.\d]+)[, ]+([-.\d]+)[, ]+([-.\d]+)/i);
    if (rgbMatch) {
      return new THREE.Color().setRGB(
        Number(rgbMatch[1]) / 255,
        Number(rgbMatch[2]) / 255,
        Number(rgbMatch[3]) / 255,
        THREE.SRGBColorSpace,
      );
    }
    const srgbMatch = cssColor.match(/color\(srgb\s+([-.\d]+)\s+([-.\d]+)\s+([-.\d]+)/i);
    if (srgbMatch) {
      return new THREE.Color().setRGB(
        Number(srgbMatch[1]),
        Number(srgbMatch[2]),
        Number(srgbMatch[3]),
        THREE.SRGBColorSpace,
      );
    }
    return new THREE.Color().setStyle(cssColor);
  };

    const clamped = THREE.MathUtils.clamp(value, 0, 1);
    return clamped * clamped * (3 - 2 * clamped);
  }

  function cameraPositionForMorph(amount, target = new THREE.Vector3()) {
    if (amount &lt;= rollEnd) {
      return target.lerpVectors(flatCamera, cylinderCamera, smoothstep(amount / rollEnd));
    }
    return target.lerpVectors(
      cylinderCamera,
      torusCamera,
      smoothstep((amount - rollEnd) / (1 - rollEnd)),
    );
  }

  function resetCamera() {
    cameraAuto = true;
    camera.position.copy(cameraPositionForMorph(morph));
    controls.target.set(0, 0, 0);
    controls.update();
  }

  function flatPoint(a, b, target = new THREE.Vector3()) {
    return target.set(
      (a / L - 0.5) * flatSpan,
      (b / L - 0.5) * flatSpan,
      0,
    );
  }

  function cylinderPoint(a, b, target = new THREE.Vector3()) {
    const v = (2 * Math.PI * b) / L;
    return target.set(
      (a / L - 0.5) * flatSpan,
      minorRadius * Math.cos(v),
      minorRadius * Math.sin(v),
    );
  }

  function bentTubePoint(a, b, bendAmount, target = new THREE.Vector3()) {
    const q = THREE.MathUtils.clamp(bendAmount, 0, 1);
    if (q &lt; 1e-6) {
      return cylinderPoint(a, b, target);
    }

    const u = 2 * Math.PI * (a / L - 0.5);
    const v = (2 * Math.PI * b) / L;
    const theta = q * u;
    const baseRadius = flatSpan / (2 * Math.PI);
    const curveRadius = baseRadius / q;
    const centerScale = THREE.MathUtils.lerp(1, majorRadius / baseRadius, smoothstep(q));
    const centerX = curveRadius * Math.sin(theta) * centerScale;
    const centerY = (curveRadius * (Math.cos(theta) - 1) + q * baseRadius) * centerScale;
    const crossSection = minorRadius * Math.cos(v);

    return target.set(
      centerX + crossSection * Math.sin(theta),
      centerY + crossSection * Math.cos(theta),
      minorRadius * Math.sin(v),
    );
  }

  function displayPoint(a, b, amount = morph, target = new THREE.Vector3()) {
    if (amount &lt;= rollEnd) {
      const flat = flatPoint(a, b, new THREE.Vector3());
      const cylinder = cylinderPoint(a, b, new THREE.Vector3());
      return target.lerpVectors(flat, cylinder, smoothstep(amount / rollEnd));
    }
    return bentTubePoint(
      a,
      b,
      smoothstep((amount - rollEnd) / (1 - rollEnd)),
      target,
    );
  }

  function edgePoint(edge, t, amount = morph, target = new THREE.Vector3()) {
    if (edge.orientation === &quot;H&quot;) {
      return displayPoint(edge.x + t, edge.y, amount, target);
    } else {
      return displayPoint(edge.x, edge.y + t, amount, target);
    }
  }

  function makeEdges() {
    const result = [];
    for (const orientation of [&quot;H&quot;, &quot;V&quot;]) {
      for (let y = 0; y &lt; L; y += 1) {
        for (let x = 0; x &lt; L; x += 1) {
          result.push({ orientation, x, y });
        }
      }
    }
    return result;
  }

  function disposeObject(object) {
    if (!object) return;
    model.remove(object);
    object.geometry?.dispose();
    if (Array.isArray(object.material)) {
      object.material.forEach((material) =&gt; material.dispose());
    } else {
      object.material?.dispose();
    }
  }

  function buildSurface() {
    disposeObject(morphSurface);
    surfaceCoordinates = [];
    const positions = [];
    const indices = [];

    for (let vIndex = 0; vIndex &lt;= surfaceVSegments; vIndex += 1) {
      for (let uIndex = 0; uIndex &lt;= surfaceUSegments; uIndex += 1) {
        const a = (L * uIndex) / surfaceUSegments;
        const b = (L * vIndex) / surfaceVSegments;
        surfaceCoordinates.push([a, b]);
        const point = displayPoint(a, b);
        positions.push(point.x, point.y, point.z);
      }
    }

    const rowLength = surfaceUSegments + 1;
    for (let vIndex = 0; vIndex &lt; surfaceVSegments; vIndex += 1) {
      for (let uIndex = 0; uIndex &lt; surfaceUSegments; uIndex += 1) {
        const a = vIndex * rowLength + uIndex;
        const b = a + 1;
        const c = a + rowLength;
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }

    const geometry = new THREE.BufferGeometry();
    const positionAttribute = new THREE.Float32BufferAttribute(positions, 3);
    positionAttribute.setUsage(THREE.DynamicDrawUsage);
    geometry.setAttribute(&quot;position&quot;, positionAttribute);
    geometry.setIndex(indices);
    geometry.computeVertexNormals();

    morphSurface = new THREE.Mesh(
      geometry,
      new THREE.MeshPhysicalMaterial({
        color: colors.surface,
        transparent: true,
        opacity: 0.18,
        roughness: 0.84,
        metalness: 0.02,
        side: THREE.DoubleSide,
        depthWrite: false,
      }),
    );
    model.add(morphSurface);
  }

  function buildEdgeLines() {
    disposeObject(edgeLine);
    edgeCoordinates = [];
    const positions = [];

    edges.forEach((edge) =&gt; {
      for (let segment = 0; segment &lt; edgeSegments; segment += 1) {
        const t0 = segment / edgeSegments;
        const t1 = (segment + 1) / edgeSegments;
        edgeCoordinates.push([edge, t0], [edge, t1]);
        const p0 = edgePoint(edge, t0);
        const p1 = edgePoint(edge, t1);
        positions.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z);
      }
    });

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(&quot;position&quot;, new THREE.Float32BufferAttribute(positions, 3));
    edgeLine = new THREE.LineSegments(
      geometry,
      new THREE.LineBasicMaterial({
        color: colors.grid,
        transparent: true,
        opacity: 0.42,
      }),
    );
    model.add(edgeLine);
  }

  function buildQubitMeshes() {
    disposeObject(aliveMesh);
    disposeObject(lostMesh);

    const aliveIndices = [];
    const lostIndices = [];
    lossSample.forEach((lost, edgeIndex) =&gt; {
      (lost ? lostIndices : aliveIndices).push(edgeIndex);
    });

    const sphere = new THREE.SphereGeometry(1, 14, 10);
    const sphereMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.5,
      metalness: 0.03,
    });
    aliveMesh = new THREE.InstancedMesh(sphere, sphereMaterial, aliveIndices.length);
    aliveMesh.userData.edgeIndices = aliveIndices;
    aliveIndices.forEach((edgeIndex, instanceIndex) =&gt; {
      aliveMesh.setColorAt(
        instanceIndex,
        edges[edgeIndex].orientation === &quot;H&quot; ? colors.h : colors.v,
      );
    });
    if (aliveMesh.instanceColor) aliveMesh.instanceColor.needsUpdate = true;
    model.add(aliveMesh);

    const diamond = new THREE.OctahedronGeometry(1, 0);
    const lossMaterial = new THREE.MeshStandardMaterial({
      color: colors.loss,
      roughness: 0.48,
      metalness: 0.02,
    });
    lostMesh = new THREE.InstancedMesh(diamond, lossMaterial, lostIndices.length);
    lostMesh.userData.edgeIndices = lostIndices;
    model.add(lostMesh);
  }

  function buildBoundaryLine(color, pointAt) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      &quot;position&quot;,
      new THREE.Float32BufferAttribute(new Array((cycleSegments + 1) * 3).fill(0), 3),
    );
    const line = new THREE.Line(
      geometry,
      new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity: 0.98,
        depthTest: false,
      }),
    );
    line.userData.pointAt = pointAt;
    line.renderOrder = 8;
    return line;
  }

  function buildCycles() {
    boundaryLines.forEach(disposeObject);
    boundaryLines = [
      buildBoundaryLine(colors.u, (t) =&gt; displayPoint(0, L * t)),
      buildBoundaryLine(colors.u, (t) =&gt; displayPoint(L, L * t)),
      buildBoundaryLine(colors.cycleV, (t) =&gt; displayPoint(L * t, 0)),
      buildBoundaryLine(colors.cycleV, (t) =&gt; displayPoint(L * t, L)),
    ];
    model.add(...boundaryLines);
  }

  function buildSelectionMarker() {
    disposeObject(selectedMarker);
    selectedMarker = new THREE.Mesh(
      new THREE.SphereGeometry(1, 16, 10),
      new THREE.MeshBasicMaterial({ color: colors.selected, wireframe: true }),
    );
    model.add(selectedMarker);
  }

  function qubitRadius() {
    return Math.max(0.065, Math.min(0.145, 0.24 * Math.sqrt(4 / L)));
  }

  function updateEdgeLinePositions() {
    if (!edgeLine) return;
    const attribute = edgeLine.geometry.getAttribute(&quot;position&quot;);
    edgeCoordinates.forEach(([edge, t], index) =&gt; {
      const point = edgePoint(edge, t);
      attribute.setXYZ(index, point.x, point.y, point.z);
    });
    attribute.needsUpdate = true;
    edgeLine.geometry.computeBoundingSphere();
  }

  function updateSurfacePositions() {
    if (!morphSurface) return;
    const attribute = morphSurface.geometry.getAttribute(&quot;position&quot;);
    surfaceCoordinates.forEach(([a, b], index) =&gt; {
      const point = displayPoint(a, b);
      attribute.setXYZ(index, point.x, point.y, point.z);
    });
    attribute.needsUpdate = true;
    morphSurface.geometry.computeVertexNormals();
    morphSurface.geometry.computeBoundingSphere();
    morphSurface.visible = surfaceInput.checked;
  }

  function updateQubitPositions() {
    const radius = qubitRadius();
    for (const mesh of [aliveMesh, lostMesh]) {
      if (!mesh) continue;
      mesh.userData.edgeIndices.forEach((edgeIndex, instanceIndex) =&gt; {
        const point = edgePoint(edges[edgeIndex], 0.5);
        dummy.position.copy(point);
        const scale = mesh === lostMesh ? radius * 1.28 : radius;
        dummy.scale.setScalar(scale);
        dummy.rotation.set(0, 0, mesh === lostMesh ? Math.PI / 4 : 0);
        dummy.updateMatrix();
        mesh.setMatrixAt(instanceIndex, dummy.matrix);
      });
      mesh.instanceMatrix.needsUpdate = true;
      mesh.computeBoundingSphere();
    }
  }

  function updateCyclePositions() {
    boundaryLines.forEach((line) =&gt; {
      const attribute = line.geometry.getAttribute(&quot;position&quot;);
      for (let index = 0; index &lt;= cycleSegments; index += 1) {
        const point = line.userData.pointAt(index / cycleSegments);
        attribute.setXYZ(index, point.x, point.y, point.z);
      }
      attribute.needsUpdate = true;
      line.geometry.computeBoundingSphere();
      line.visible = cyclesInput.checked;
    });
  }

  function mod(value) {
    return ((value % L) + L) % L;
  }

  function edgeDescription(edgeIndex) {
    const edge = edges[edgeIndex];
    const state = lossSample[edgeIndex] ? &quot;known loss&quot; : &quot;surviving&quot;;
    const wrap = (
      (edge.orientation === &quot;H&quot; &amp;&amp; edge.x === L - 1)
      || (edge.orientation === &quot;V&quot; &amp;&amp; edge.y === L - 1)
    ) ? &quot; · periodic wrap&quot; : &quot;&quot;;
    let stars;
    let plaquettes;

    if (edge.orientation === &quot;H&quot;) {
      stars = `S(${edge.x},${edge.y}) ↔ S(${mod(edge.x + 1)},${edge.y})`;
      plaquettes = `P(${edge.x},${edge.y}) ↔ P(${edge.x},${mod(edge.y - 1)})`;
    } else {
      stars = `S(${edge.x},${edge.y}) ↔ S(${edge.x},${mod(edge.y + 1)})`;
      plaquettes = `P(${edge.x},${edge.y}) ↔ P(${mod(edge.x - 1)},${edge.y})`;
    }
    return `${edge.orientation}(${edge.x},${edge.y}) · ${state}${wrap} · ${stars} · ${plaquettes}`;
  }

  function updateSelection() {
    if (!edges.length) return;
    selectedEdgeIndex = Math.min(selectedEdgeIndex, edges.length - 1);
    const edge = edges[selectedEdgeIndex];
    const point = edgePoint(edge, 0.5);
    selectedMarker.position.copy(point);
    selectedMarker.scale.setScalar(qubitRadius() * 1.75);
    selectionLabel.textContent = edgeDescription(selectedEdgeIndex);
  }

  function updateModelPositions() {
    updateSurfacePositions();
    updateEdgeLinePositions();
    updateQubitPositions();
    updateCyclePositions();
    updateSelection();
    updateMorphUI();
  }

  function morphPhase(amount) {
    if (amount &lt; 0.015) {
      return { key: &quot;flat&quot;, label: &quot;펼친 격자&quot; };
    }
    if (amount &lt; rollEnd - 0.025) {
      return { key: &quot;cylinder&quot;, label: &quot;위·아래 연결&quot; };
    }
    if (amount &lt;= rollEnd + 0.025) {
      return { key: &quot;cylinder&quot;, label: &quot;원통 완성&quot; };
    }
    if (amount &lt; 0.985) {
      return { key: &quot;torus&quot;, label: &quot;좌·우 연결&quot; };
    }
    return { key: &quot;torus&quot;, label: &quot;토러스 완성&quot; };
  }

  function updateMorphUI() {
    const phase = morphPhase(morph);
    morphInput.value = String(morph);
    phaseLabel.textContent = phase.label;
    phaseProgress.style.width = `${(100 * morph).toFixed(1)}%`;
    phaseSteps.forEach((step) =&gt; {
      step.classList.toggle(&quot;is-active&quot;, step.dataset.phase === phase.key);
    });

    const lostCount = lossSample.filter(Boolean).length;
    stage.setAttribute(
      &quot;aria-label&quot;,
      `L=${L}, 데이터 큐빗 ${2 * L * L}개, known loss ${lostCount}개, ${phase.label} 단계`,
    );
  }

  function updateStatus() {
    const lostCount = lossSample.filter(Boolean).length;
    sizeLabels.forEach((label) =&gt; { label.textContent = `L = ${L}`; });
    sizeControl.textContent = String(L);
    qubitLabel.textContent = String(2 * L * L);
    lostLabel.textContent = String(lostCount);
    lossRateLabel.textContent = pLoss.toFixed(2);
    updateMorphUI();
  }

  function sampleLoss() {
    lossSample = edges.map(() =&gt; Math.random() &lt; pLoss);
    buildQubitMeshes();
    buildSelectionMarker();
    updateStatus();
    updateModelPositions();
  }

  function rebuildLattice() {
    edges = makeEdges();
    selectedEdgeIndex = 0;
    buildSurface();
    buildEdgeLines();
    buildCycles();
    sampleLoss();
  }

  function easeInOutCubic(value) {
    return value &lt; 0.5
      ? 4 * value * value * value
      : 1 - Math.pow(-2 * value + 2, 3) / 2;
  }

  function setViewButtonState(view) {
    viewButtons.forEach((button) =&gt; {
      const active = button.dataset.view === view;
      button.setAttribute(&quot;aria-pressed&quot;, String(active));
      button.classList.toggle(&quot;btn-primary&quot;, active);
    });
  }

  function startMorphTransition(view) {
    const target = view === &quot;torus&quot; ? 1 : 0;
    if (target === 1 &amp;&amp; morph &gt; 0.995) {
      morph = 0;
      updateModelPositions();
    }

    morphTarget = target;
    cameraAuto = true;
    setViewButtonState(view);
    const fullForward = morph &lt; 0.005 &amp;&amp; target === 1;
    const distance = Math.abs(target - morph);
    const duration = reducedMotion
      ? 0
      : (fullForward ? 5000 : Math.max(900, 3200 * distance));

    if (duration === 0) {
      morph = target;
      morphTransition = null;
      updateModelPositions();
      resetCamera();
      return;
    }

    morphTransition = {
      from: morph,
      to: target,
      start: performance.now(),
      duration,
      fullForward,
    };
  }

  function resize() {
    const width = Math.max(1, stage.clientWidth);
    const height = Math.max(1, stage.clientHeight);
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    model.position.x = width &lt; 560 ? -0.38 : -0.58;
  }

  function pickQubit(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const intersections = raycaster.intersectObjects([aliveMesh, lostMesh].filter(Boolean));
    if (!intersections.length) return;
    const hit = intersections[0];
    selectedEdgeIndex = hit.object.userData.edgeIndices[hit.instanceId];
    updateSelection();
  }

  morphInput.addEventListener(&quot;input&quot;, () =&gt; {
    morphTransition = null;
    morph = Number(morphInput.value);
    morphTarget = morph;
    cameraAuto = true;
    updateModelPositions();
    camera.position.copy(cameraPositionForMorph(morph));
    controls.target.set(0, 0, 0);
    controls.update();
    if (morph &lt; 0.005) {
      setViewButtonState(&quot;flat&quot;);
    } else if (morph &gt; 0.995) {
      setViewButtonState(&quot;torus&quot;);
    } else {
      viewButtons.forEach((button) =&gt; {
        button.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
        button.classList.remove(&quot;btn-primary&quot;);
      });
    }
  });
  sizeInput.addEventListener(&quot;input&quot;, () =&gt; {
    sizeControl.textContent = sizeInput.value;
  });
  sizeInput.addEventListener(&quot;change&quot;, () =&gt; {
    L = Number(sizeInput.value);
    rebuildLattice();
  });
  lossInput.addEventListener(&quot;input&quot;, () =&gt; {
    pLoss = Number(lossInput.value);
    lossRateLabel.textContent = pLoss.toFixed(2);
  });
  lossInput.addEventListener(&quot;change&quot;, sampleLoss);
  surfaceInput.addEventListener(&quot;change&quot;, updateModelPositions);
  cyclesInput.addEventListener(&quot;change&quot;, updateCyclePositions);
  resampleButton.addEventListener(&quot;click&quot;, sampleLoss);
  resetButton.addEventListener(&quot;click&quot;, resetCamera);
  viewButtons.forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; startMorphTransition(button.dataset.view));
  });
  controls.addEventListener(&quot;start&quot;, () =&gt; {
    cameraAuto = false;
  });

  renderer.domElement.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
    pointerStart = { x: event.clientX, y: event.clientY };
  });
  renderer.domElement.addEventListener(&quot;pointerup&quot;, (event) =&gt; {
    if (!pointerStart) return;
    const distance = Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y);
    pointerStart = null;
    if (distance &lt; 5) pickQubit(event);
  });

  new ResizeObserver(resize).observe(stage);
  resetCamera();
  rebuildLattice();
  resize();

  function animate(timestamp) {
    requestAnimationFrame(animate);
    if (morphTransition) {
      const progress = THREE.MathUtils.clamp(
        (timestamp - morphTransition.start) / morphTransition.duration,
        0,
        1,
      );

      if (morphTransition.fullForward) {
        if (progress &lt; 0.38) {
          morph = rollEnd * easeInOutCubic(progress / 0.38);
        } else if (progress &lt; 0.52) {
          morph = rollEnd;
        } else {
          morph = THREE.MathUtils.lerp(
            rollEnd,
            1,
            easeInOutCubic((progress - 0.52) / 0.48),
          );
        }
      } else {
        morph = THREE.MathUtils.lerp(
          morphTransition.from,
          morphTransition.to,
          easeInOutCubic(progress),
        );
      }

      updateModelPositions();
      if (cameraAuto) {
        camera.position.copy(cameraPositionForMorph(morph));
        controls.target.set(0, 0, 0);
      }
      if (progress &gt;= 1) {
        morph = morphTransition.to;
        morphTransition = null;
        updateModelPositions();
      }
    }
    controls.update();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);
&lt;/script&gt;
